# ──────────────────────────────────────────────────────────────────────────────
# Grammar languages
#
# Versions here are kept in sync with go.mod via:
#   make sync-config            (preview changes)
#   make sync-config-apply      (apply changes)
#
# Fields:
#   name         - identifier used in file paths and CLI flags
#   grammar      - exported C symbol suffix (defaults to name with . and - stripped)
#   constructor  - CGo function name (must equal tree_sitter_<grammar>)
#   version      - Go module version from go.mod
#   repository   - upstream grammar git repository URL
#   revision     - pinned full 40-char commit SHA (required for reproducible builds)
#   source_subdir- subdirectory within the repo (for multi-grammar repos like typescript)
#   sample       - minimal code snippet used to smoke-test the compiled parser
# ──────────────────────────────────────────────────────────────────────────────

# Optional per-language language_support assessments use their own assessed_revision.
# Absent = unknown/unverified; dependency updates must never move assessment pins.
# No language-version research or verification is triggered by build/compile/move.
# See docs/reference/configuration-schema.md for evidence rules and the follow-up workflow.
languages:
  - name: "bash"
    grammar: "bash"
    constructor: "tree_sitter_bash"
    version: "v0.25.1"
    repository: "https://github.com/tree-sitter/tree-sitter-bash.git"
    revision: "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
    language_support:
      assessed_revision: "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
      claim: unverified
      limitations:
        - "No explicit source-language version support claim was found in the exact-revision upstream README; support remains unknown."
    sample: "echo \"hello world\"\n"

  - name: "blade"
    grammar: "blade"
    constructor: "tree_sitter_blade"
    version: "v0.12.3"
    repository: "https://github.com/EmranMR/tree-sitter-blade.git"
    revision: "cc764dadcbbceb3f259396fef66f970c72e94f96"
    language_support:
      assessed_revision: "cc764dadcbbceb3f259396fef66f970c72e94f96"
      claim: unverified
      limitations:
        - "The README links Laravel Blade documentation but does not state supported Blade or Laravel versions."
    sample: "<div>{{ $slot }}</div>\n"

  - name: "c"
    grammar: "c"
    constructor: "tree_sitter_c"
    version: "v0.24.2"
    repository: "https://github.com/tree-sitter/tree-sitter-c.git"
    revision: "b780e47fc780ddc8da13afa35a3f4ed5c157823d"
    language_support:
      assessed_revision: "b780e47fc780ddc8da13afa35a3f4ed5c157823d"
      claim: unverified
      limitations:
        - "The README says this grammar was adapted from a C99 grammar, but does not state supported C standards."
    sample: "int main(void) { return 0; }\n"

  - name: "csharp"
    grammar: "c_sharp"
    constructor: "tree_sitter_c_sharp"
    version: "v0.23.6-0.20260929081004-8c0abe0b84a3"
    repository: "https://github.com/tree-sitter/tree-sitter-c-sharp.git"
    revision: "8c0abe0b84a3681d3e6852ce2e2a1eecb4f731c5"
    language_support:
      assessed_revision: "8c0abe0b84a3681d3e6852ce2e2a1eecb4f731c5"
      claim: verified
      min_version: "1"
      max_version: "14.0"
      limitations:
        - "The README excludes async, var, and await as identifiers everywhere they are valid."
        - "The README says file-based app preprocessor directives #:property, #:package, #:sdk, and #:project are not yet recognized."
      evidence:
        - kind: documentation
          source: "https://raw.githubusercontent.com/tree-sitter/tree-sitter-c-sharp/8c0abe0b84a3681d3e6852ce2e2a1eecb4f731c5/README.md"
          description: "The README states comprehensive support for C# 1 through 14.0, subject to its listed exceptions."
    sample: "class Program { static void Main() {} }\n"

  - name: "cmake"
    grammar: "cmake"
    constructor: "tree_sitter_cmake"
    version: "v0.7.6"
    repository: "https://github.com/uyha/tree-sitter-cmake.git"
    revision: "a3ec2b2144daf7132e7ee824d8cab9610523d10f"
    language_support:
      assessed_revision: "a3ec2b2144daf7132e7ee824d8cab9610523d10f"
      claim: unverified
      limitations:
        - "No explicit source-language version support claim was found in the exact-revision upstream README; support remains unknown."
    sample: "cmake_minimum_required(VERSION 3.10)\n"

  - name: "cpp"
    grammar: "cpp"
    constructor: "tree_sitter_cpp"
    version: "v0.23.5-0.20260917200152-c00922280863"
    repository: "https://github.com/tree-sitter/tree-sitter-cpp.git"
    revision: "c009222808634c1014f82438d4883753516a2c24"
    language_support:
