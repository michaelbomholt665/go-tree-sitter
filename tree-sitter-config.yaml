version: "2.0"

# ──────────────────────────────────────────────────────────────────────────────
# Build toolchain
# ──────────────────────────────────────────────────────────────────────────────

# Directory used for cloning grammar repos and staging intermediate artifacts.
build_dir: "build"

# tree-sitter CLI version that must be installed and on PATH (npm install -g tree-sitter-cli).
tree_sitter_cli_version: "0.27.0"

# Supported ABI range for Tree-sitter parsers (13 to 15).
# The Go runtime (github.com/tree-sitter/go-tree-sitter) supports ABIs 13 through 15.
# ABI 15 is backward-compatible with ABI 14 and 13.
abi_range:
  min: 13
  max: 15

# Target ABI version passed to `tree-sitter generate --abi` (must fall within abi_range).
# Can be overridden per-language with `generate_abi`.
generate_abi: 15

# C/C++ compiler flags applied when building shared libraries.
build_flags:
  - "-O2"
  - "-fPIC"

# ──────────────────────────────────────────────────────────────────────────────
# Active compilation target
# ──────────────────────────────────────────────────────────────────────────────

# Set OS_TARGET to one of the keys under `targets` to pick a cross-compilation
# target. This is the default target used by `make compile` and `make release`.
# Override per-invocation with: go run ./cmd/ts-build compile --os linux --arch amd64
OS_TARGET: "linux"

# ──────────────────────────────────────────────────────────────────────────────
# Compiler toolchain definitions
# Each entry name must match a possible OS_TARGET value.
# ──────────────────────────────────────────────────────────────────────────────

targets:
  linux:
    os: "linux"
    arch: "amd64"
    triple: "x86_64-linux-gnu"
    compiler: "gcc"
    cxx: "g++"
    compiler_version: "14.2.0"

  windows:
    os: "windows"
    arch: "amd64"
    triple: "x86_64-windows-gnu"
    compiler: "x86_64-w64-mingw32-gcc"
    cxx: "x86_64-w64-mingw32-g++"
    compiler_version: "14.2.0"

  macos-amd64:
    os: "macos"
    arch: "amd64"
    triple: "x86_64-apple-darwin"
    compiler: "o64-clang"
    cxx: "o64-clang++"
    compiler_version: "18.1.8"

  macos-arm64:
    os: "macos"
    arch: "arm64"
    triple: "aarch64-apple-darwin"
    compiler: "oa64-clang"
    cxx: "oa64-clang++"
    compiler_version: "18.1.8"

# ──────────────────────────────────────────────────────────────────────────────
# Output paths and publication settings
# ──────────────────────────────────────────────────────────────────────────────

output:
  # Root directory where grammar artifacts (binaries, node-types.json, queries,
  # and manifest.json) are published.  Each language gets its own sub-directory:
  #   data/tree-sitter/grammar/<name>/
  grammar_base: "data/tree-sitter/grammar"

  # Template for the intermediate build directory (grammar source + generated files).
  # Supported placeholders: {build_dir}, {lang}, {language}, {os}, {goos}, {arch}, {version}
  grammar_build: "{build_dir}/{lang}/{arch}"

  # Template for the compiled binary output directory.
  grammar_compile: "{build_dir}/{lang}/{arch}"

  # Always emit manifest.json alongside the published binaries.
  generate_manifest: true

  # Default file-copy mode when running `tree-sitter move`.
  #   --json   copy binaries + node-types.json only
  #   --scm    copy binaries + queries/ only
  #   --both   copy binaries, node-types.json, and queries/
  default_move_mode: "--both"

  supported_move_modes:
    - "--json"
    - "--scm"
    - "--both"

# Runtime policy (omitted fields retain these defaults).
# CLI flags override publication defaults, including explicit false values.
runtime:
    tools:
        tree_sitter: tree-sitter
        git: git
        npm: npm
        emcc: emcc
        docker: docker
        podman: podman
        zig: zig
    wasm:
        backend: auto
        image: emscripten/emsdk
    compiler:
        allow_fallback: true
        host_cc: cc
        candidates:
            linux/amd64:
                - cc: gcc
                  cxx: g++
                - cc: clang
                  cxx: clang++
            macos/amd64:
                - cc: o64-clang
                  cxx: o64-clang++
                - cc: x86_64-apple-darwin-clang
                  cxx: x86_64-apple-darwin-clang++
            macos/arm64:
                - cc: oa64-clang
                  cxx: oa64-clang++
                - cc: aarch64-apple-darwin-clang
                  cxx: aarch64-apple-darwin-clang++
            windows/amd64:
                - cc: x86_64-w64-mingw32-gcc
                  cxx: x86_64-w64-mingw32-g++
    node:
        install: auto
        ci_args:
            - ci
            - --ignore-scripts
        install_args:
            - install
            - --ignore-scripts
            - --no-audit
            - --no-fund
        retry_install: true
    generation:
        abi_fallback: true
    cleanup:
        after_move: remove
        prune:
            directories:
                - .git
                - .github
                - .vscode
                - .idea
                - node_modules
                - bindings
                - test
                - tests
                - corpus
                - examples
                - target
                - docs
                - doc
                - script
                - scripts
                - tools
                - benchmark
                - benchmarks
                - _layouts
                - build/Release
            files:
                - '*.o'
                - '*.obj'
                - '*.a'
                - '*.lib'
                - '*.lock'
                - '*.resolved'
                - go.sum
                - package-lock.json
                - pnpm-lock.yaml
                - .gitignore
                - .gitattributes
                - .gitmodules
                - .editorconfig
                - .clang-format
                - .git-blame-ignore-revs
                - .envrc
                - .npmignore
                - eslint.config.*
                - .eslintrc*
                - .prettierrc*
                - .prettierignore
                - .tsqueryrc.json
                - README*
                - CHANGELOG*
                - CONTRIBUTING*
                - SECURITY*
                - FUNDING*
                - ISSUE_TEMPLATE*
                - CODE_OF_CONDUCT*
                - package.swift
                - binding.gyp
                - setup.py
                - pyproject.toml
                - cargo.toml
                - cmakelists.txt
                - makefile
                - justfile
                - build.zig
                - build.zig.zon
                - gemfile
            preserve_files:
                - tree-sitter.json
                - package.json
                - go.mod
                - LICENSE*
                - LICENCE*
                - NOTICE*
                - grammar.js
                - node-types.json
                - .source-provenance.json
            preserve_directories:
                - src
                - queries
            protected_files:
                - '*.o'
                - '*.obj'
                - '*.a'
                - '*.lib'
    publication:
        manifest: true
        compact: false
        check_compact: false
        source: false
        js: false
        wasm: false
        force: false
        allow_cross_validation: false
    supported_targets:
        linux:
            - amd64
        macos:
            - amd64
            - arm64
        windows:
            - amd64
    wizard:
        platforms:
            - host
        artifacts:
            - manifest
            - scm
    queries:
        paths: {}
        rewrites:
            - language: ocaml-interface
              file: highlights.scm
              find: ' (shebang)'
              replace: ""
    sync_modules:
        github.com/DerekStride/tree-sitter-sql:
            - sql
        github.com/EmranMR/tree-sitter-blade:
            - blade
        github.com/JoranHonig/tree-sitter-solidity:
            - solidity
        github.com/UserNobody14/tree-sitter-dart:
            - dart
        github.com/airbus-cert/tree-sitter-powershell:
            - powershell
        github.com/bajrangCoder/tree-sitter-sass:
            - sass
        github.com/camdencheek/tree-sitter-dockerfile:
            - dockerfile
        github.com/camdencheek/tree-sitter-go-mod:
            - go.mod
        github.com/coder3101/tree-sitter-proto:
            - proto
        github.com/elixir-lang/tree-sitter-elixir:
            - elixir
        github.com/fwcd/tree-sitter-kotlin:
            - kotlin
        github.com/gleam-lang/tree-sitter-gleam:
            - gleam
        github.com/ionide/tree-sitter-fsharp:
            - fsharp
            - fsharp-signature
        github.com/joakker/tree-sitter-json5.git:
            - json5
        github.com/pupli/tree-sitter-cypher:
            - cypher
        github.com/tree-sitter-grammars/tree-sitter-go-sum:
            - go.sum
        github.com/tree-sitter-grammars/tree-sitter-hcl:
            - hcl
        github.com/tree-sitter-grammars/tree-sitter-lua:
            - lua
        github.com/tree-sitter-grammars/tree-sitter-markdown:
            - markdown
            - markdown-inline
        github.com/tree-sitter-grammars/tree-sitter-objc:
            - objc
        github.com/tree-sitter-grammars/tree-sitter-scss:
            - scss
        github.com/tree-sitter-grammars/tree-sitter-svelte:
            - svelte
        github.com/tree-sitter-grammars/tree-sitter-toml:
            - toml
        github.com/tree-sitter-grammars/tree-sitter-yaml:
            - yaml
        github.com/tree-sitter/tree-sitter-bash:
            - bash
        github.com/tree-sitter/tree-sitter-c:
            - c
        github.com/tree-sitter/tree-sitter-c-sharp:
            - csharp
        github.com/tree-sitter/tree-sitter-cpp:
            - cpp
        github.com/tree-sitter/tree-sitter-css:
            - css
        github.com/tree-sitter/tree-sitter-elixir:
            - elixir
        github.com/tree-sitter/tree-sitter-go:
            - go
        github.com/tree-sitter/tree-sitter-haskell:
            - haskell
        github.com/tree-sitter/tree-sitter-html:
            - html
        github.com/tree-sitter/tree-sitter-java:
            - java
        github.com/tree-sitter/tree-sitter-javascript:
            - javascript
        github.com/tree-sitter/tree-sitter-json:
            - json
        github.com/tree-sitter/tree-sitter-julia:
            - julia
        github.com/tree-sitter/tree-sitter-ocaml:
            - ocaml
            - ocaml-interface
        github.com/tree-sitter/tree-sitter-php:
            - php
            - php_only
        github.com/tree-sitter/tree-sitter-python:
            - python
        github.com/tree-sitter/tree-sitter-regex:
            - regex
        github.com/tree-sitter/tree-sitter-ruby:
            - ruby
        github.com/tree-sitter/tree-sitter-rust:
            - rust
        github.com/tree-sitter/tree-sitter-scala:
            - scala
        github.com/tree-sitter/tree-sitter-swift:
            - swift
        github.com/tree-sitter/tree-sitter-typescript:
            - typescript
            - tsx
        github.com/tree-sitter/tree-sitter-zsh:
            - zsh
        github.com/uyha/tree-sitter-cmake:
