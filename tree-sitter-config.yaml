version: "1.0"

build_dir: "build"

OS_TARGET: "linux"

targets:
  linux:
    os: "linux"
    arch: "amd64"
  windows:
    os: "windows"
    arch: "amd64"
  macos-amd64:
    os: "macos"
    arch: "amd64"
  macos-arm64:
    os: "macos"
    arch: "arm64"

abi_versions:
  "0.20.8": { min: 13, max: 13 }
  "0.23.2": { min: 14, max: 14 }
  "0.23.3": { min: 14, max: 14 }
  "0.24.4": { min: 14, max: 14 }
  "0.24.7": { min: 14, max: 14 }
  "0.24.8": { min: 14, max: 14 }
  "0.25.0": { min: 15, max: 15 }
  "0.26.3": { min: 15, max: 15 }
  "0.26.8": { min: 15, max: 15 }

languages:
  - name: "python"
    version: "v0.25.0"
    tree_sitter_version: "0.25.0"
    repository: "https://github.com/tree-sitter/tree-sitter-python.git"

  - name: "go"
    version: "v0.25.0"
    tree_sitter_version: "0.25.0"
    repository: "https://github.com/tree-sitter/tree-sitter-go.git"

  - name: "typescript"
    version: "v0.23.3-0.20250130221139-75b3874edb2d"
    tree_sitter_version: "0.23.3"
    repository: "https://github.com/tree-sitter/tree-sitter-typescript.git"
    source_subdir: "typescript"

  - name: "javascript"
    version: "v0.25.0"
    tree_sitter_version: "0.25.0"
    repository: "https://github.com/tree-sitter/tree-sitter-javascript.git"

  - name: "java"
    version: "v0.23.5"
    tree_sitter_version: "0.24.4"
    repository: "https://github.com/tree-sitter/tree-sitter-java.git"
    note: "Installed module version v0.23.5 uses tree-sitter-cli v0.24.4 and emits ABI 14."

  - name: "html"
    version: "v0.23.2"
    tree_sitter_version: "0.23.2"
    repository: "https://github.com/tree-sitter/tree-sitter-html.git"

  - name: "css"
    version: "v0.25.0"
    tree_sitter_version: "0.25.0"
    repository: "https://github.com/tree-sitter/tree-sitter-css.git"

  - name: "tsx"
    version: "v0.23.3-0.20250130221139-75b3874edb2d"
    tree_sitter_version: "0.23.3"
    repository: "https://github.com/tree-sitter/tree-sitter-typescript.git"
    source_subdir: "tsx"
    note: "Built from tree-sitter-typescript, TSX variant; the configured pseudo-version is checked out by commit."

  - name: "json"
    version: "v0.24.8"
    tree_sitter_version: "0.24.8"
    repository: "https://github.com/tree-sitter/tree-sitter-json.git"

  - name: "yaml"
    version: "v0.7.2"
    tree_sitter_version: "0.24.8"
    repository: "https://github.com/tree-sitter-grammars/tree-sitter-yaml.git"
    note: "Community maintained; installed module version v0.7.2 emits ABI 14."

  - name: "toml"
    version: "v0.7.0"
    tree_sitter_version: "0.24.4"
    repository: "https://github.com/tree-sitter-grammars/tree-sitter-toml.git"
    note: "Community maintained; installed module version v0.7.0 uses tree-sitter-cli v0.24.4 and emits ABI 14."

  - name: "proto"
    version: "v0.0.0-20260623132456-cf8e4eba6e5b"
    tree_sitter_version: "0.26.3"
    repository: "https://github.com/coder3101/tree-sitter-proto.git"
    note: "Installed pseudo-version uses tree-sitter-cli v0.26.3 and emits ABI 15."

  - name: "go.mod"
    version: "v1.1.0"
    tree_sitter_version: "0.20.8"
    repository: "https://github.com/camdencheek/tree-sitter-go-mod.git"

  - name: "go.sum"
    version: "v1.0.0"
    tree_sitter_version: "0.24.8"
    repository: "https://github.com/tree-sitter-grammars/tree-sitter-go-sum.git"
    note: "Installed module version v1.0.0 emits ABI 14."

  - name: "sql"
    version: "v0.3.11"
    tree_sitter_version: "0.24.7"
    repository: "https://github.com/DerekStride/tree-sitter-sql.git"
    note: "Installed module version v0.3.11 targets tree-sitter-cli v0.24.7 / ABI 14."

  - name: "cypher"
    version: "v0.0.2-0.20241111152014-775717a2de6c"
    tree_sitter_version: "0.26.8"
    repository: "https://github.com/simplificare-org/tree-sitter-cypher.git"
    note: "Pinned to the first corrected Cypher grammar commit after the mislabeled v0.0.1 tag; regenerated locally with tree-sitter-cli v0.26.8 and emits ABI 15."

output:
  grammar_base: "data/tree-sitter/grammar" # this is the end dir for compiled and moved files
  grammar_build: "build/{lang}/{arch}" # this is the dir where the files are built
  grammar_compile: "build/{lang}/{arch}" # this is the dir where the files are compiled
  generate_manifest: true
  default_move_mode: "--both"
  supported_move_modes:
    - "--json"
    - "--scm"
    - "--both"
